name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: for f in *.js; do node --check "$f"; done
      - name: Validate manifest
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json'))"
      - name: Unit tests
        run: node --test
